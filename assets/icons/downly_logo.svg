<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141F1A"/>
      <stop offset="50%" stop-color="#0A110D"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>

    <!-- Emerald Glow Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00D99A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#004D36" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Neon Emerald Primary Gradient -->
    <linearGradient id="neon-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26FFB4"/>
      <stop offset="40%" stop-color="#00E6A2"/>
      <stop offset="100%" stop-color="#009B70"/>
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="inner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E0FFF3"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bg-grad)" filter="url(#subtle-shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#border-grad)" stroke-width="3"/>

  <!-- Inner Soft Light Ring -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="none" stroke="url(#inner-glow)" stroke-width="1.5" opacity="0.6"/>

  <!-- Logo Mark: Stylized 'D' + Download Flow -->
  <g transform="translate(256, 256)" filter="url(#emerald-glow)">
    <!-- Right Arc: The 'D' Curvature & Media Stream Ring -->
    <path d="M -20 -130 
             C 80 -130, 150 -60, 150 20 
             C 150 100, 80 170, -20 170
             L -20 120
             C 50 120, 100 70, 100 20
             C 100 -30, 50 -80, -20 -80
             Z" 
          fill="url(#neon-primary)" />

    <!-- Left Downward Arrow: Integrated as the 'D' Spine & Download Symbol -->
    <!-- Arrow Stem -->
    <path d="M -110 -130
             L -55 -130
             L -55 50
             L -110 50
             Z"
          fill="url(#neon-primary)" />

    <!-- Arrow Head -->
    <path d="M -145 35
             L -82.5 140
             L -20 35
             Z"
          fill="url(#arrow-grad)" />

    <!-- Decorative Media Dynamic Accent (Speed/Stream Dot) -->
    <circle cx="20" cy="20" r="16" fill="#00FFA3" opacity="0.9"/>
  </g>
</svg>

